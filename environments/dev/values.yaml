# Dev-specific values, layered onto the Helm chart's defaults (the chart
# itself — and its values.yaml defaults — live in employee-task-app's
# helm/employee-task/, not in this repo; see apps/dev-application.yaml for
# how ArgoCD combines the two). Small and single-replica — dev exists to
# catch problems before prod, not to be a second production.

# Two fields marked "set once during setup" below are written automatically
# by employee-task-infra/scripts/sync-config.sh right after `terraform
# apply` in terraform/global — see that repo's README.

image:
  registry: "897074277336.dkr.ecr.us-east-1.amazonaws.com" # set once during setup — terraform output ecr_repository_urls, minus the repo name
backend:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: false # one replica is enough to prove the app works; no load to autoscale for
  env:
    NODE_ENV: development
    LOG_LEVEL: debug
    RATE_LIMIT_MAX: "500"
    DB_POOL_MAX: "5"
    DB_POOL_MIN: "1"
    JWT_EXPIRES_IN: "8h"
    JWT_REFRESH_EXPIRES_IN: "7d"
  image:
    tag: dev-1bab552-62
frontend:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  image:
    tag: dev-1bab552-62
ingress:
  hosts:
    frontend: dev-app.rashmidevops.xyz
    backend: dev-api.rashmidevops.xyz
  tls:
    certificateArn: "arn:aws:acm:us-east-1:897074277336:certificate/6d81c644-658f-4f44-98d7-8b3f3b7d6475" # set once during setup — terraform output acm_certificate_arn
