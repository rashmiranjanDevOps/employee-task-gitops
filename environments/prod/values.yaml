# Prod-specific values, layered onto the Helm chart's defaults (the chart
# itself — and its values.yaml defaults — live in employee-task-app's
# helm/employee-task/, not in this repo; see apps/prod-application.yaml for
# how ArgoCD combines the two).

# Two fields marked "set once during setup" below are written automatically
# by employee-task-infra/scripts/sync-config.sh right after `terraform
# apply` in terraform/global — see that repo's README.

image:
  registry: "" # set once during setup — terraform output ecr_repository_urls, minus the repo name

backend:
  replicaCount: 2
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 750m
      memory: 768Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    cpuUtilization: 65
  env:
    NODE_ENV: production
    LOG_LEVEL: info
    RATE_LIMIT_MAX: "200"
    DB_POOL_MAX: "20"
    DB_POOL_MIN: "5"
    JWT_EXPIRES_IN: "8h"
    JWT_REFRESH_EXPIRES_IN: "7d"

frontend:
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  hosts:
    frontend: app.rashmidevops.xyz
    backend: api.rashmidevops.xyz
  tls:
    certificateArn: "" # set once during setup — terraform output acm_certificate_arn
